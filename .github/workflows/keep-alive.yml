name: Keep backend awake

# Render free web services spin down after 15 minutes without inbound traffic.
# This workflow sends an HTTP request every 10 minutes so the API stays warm.
# GitHub may delay scheduled runs by a few minutes; that is fine because Render
# only needs one request inside each 15-minute window.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Add the BACKEND_URL repository secret (e.g. https://gwx-xuk-api.onrender.com)"
            exit 1
          fi
          echo "Pinging ${BACKEND_URL%/}/health"
          curl --fail --silent --show-error --max-time 60 \
            --retry 3 --retry-delay 15 --retry-all-errors \
            "${BACKEND_URL%/}/health"
